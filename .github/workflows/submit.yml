name: Submit to stores

# Uploads a released version to the Chrome Web Store and Firefox Add-ons for review.
# The first submission to each store is manual; see docs/publishing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, for example v0.1.0
        required: true
        type: string
      chrome:
        description: Submit to the Chrome Web Store
        type: boolean
        default: true
      firefox:
        description: Submit to Firefox Add-ons
        type: boolean
        default: true
      dry-run:
        description: Dry run (check credentials only, upload nothing)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Holds the store secrets; add required reviewers to make every submission wait for approval.
    environment: stores
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a release tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Builds are reproducible, so these zips match the ones attached to the GitHub release.
      - run: bun install --frozen-lockfile
      - run: bun run zip
      - run: bun run verify

      - name: Submit
        env:
          SUBMIT_CHROME: ${{ inputs.chrome }}
          SUBMIT_FIREFOX: ${{ inputs.firefox }}
          DRY_RUN: ${{ inputs.dry-run }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: markdown@metastacklabs.com
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ "$SUBMIT_CHROME" = true ]; then args+=(--chrome-zip .output/*-chrome.zip); fi
          if [ "$SUBMIT_FIREFOX" = true ]; then
            args+=(--firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip)
          fi
          if [ "$SUBMIT_CHROME" != true ] && [ "$SUBMIT_FIREFOX" != true ]; then
            echo "::error::Choose at least one store"
            exit 1
          fi
          bunx wxt submit "${args[@]}"
